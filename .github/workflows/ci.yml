name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:
      - name: Display environment
        run: echo "Running CI in $APP_ENV environment"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Verify application files
        run: |
          test -f src/index.html
          test -f src/style.css
          test -f src/script.js
          echo "Application files verified."

      - name: Build application
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/script.js
          echo "Build verified successfully."

      - name: Verify secret exists
        env:
          DEMO_SECRET: ${{ secrets.DEVOPS_DEMO_SECRET }}
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "Secret is missing"
            exit 1
          fi

          echo "Secret is configured successfully."

      - name: Build Docker image
        run: docker build -t devops-portfolio:${{ github.sha }} .

      - name: Test Docker image
        run: docker run --rm devops-portfolio:${{ github.sha }} nginx -t

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anabauc/devops-portfolio-cicd

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/anabauc/devops-portfolio-cicd:latest
            ghcr.io/anabauc/devops-portfolio-cicd:${{ github.sha }}