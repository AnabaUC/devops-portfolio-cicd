name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:
      - name: Display environment
        run: echo "Running CI in $APP_ENV environment"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Verify application files
        run: |
          test -f src/index.html
          test -f src/style.css
          test -f src/script.js
          echo "Application files verified."

      - name: Build application
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/script.js
          echo "Build verified successfully."